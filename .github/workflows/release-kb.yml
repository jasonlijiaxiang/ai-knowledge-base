# 整库发布线：推一个 `kb-vYYYY.MM.DD` 标签，就出一个开箱即用的整库 zip。
#
# 给不用 git 的人准备的那条路——下载、解压、双击 README.html 就能读，不装任何软件。
# 包由 make_share.py 打，它自带「解压自检」：把包解到临时目录，**在解出来的那份里**
# 把门禁全跑一遍再查一遍死路径。zip 建成功只证明压缩没错，不证明拆开还是一个能用的库。
#
# 用法：
#   git tag kb-v2026.07.29 && git push origin kb-v2026.07.29

name: 发布整库

on:
  push:
    tags: ["kb-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布整库 zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # make_share.py 只把 zip 写进给它的目录，不负责建目录（本地跑时缺省写库根，
      # 目录天然存在，所以这个边角在本机试不出来——首跑就是被它挡住的）。
      - name: 打分享包（含解压自检）
        run: |
          mkdir -p dist
          python3 _maintenance/make_share.py dist

      # 资产名必须是纯 ASCII：GitHub 上传时会把非 ASCII 字符压成点号，
      # make_share 打出来的「AI知识库-2026-07-29.zip」会变成「AI.-2026-07-29.zip」。
      # 只改外面这层文件名，解压出来的目录名仍是中文的（首跑实测确认）。
      - name: 改成 ASCII 资产名
        id: pkg
        run: |
          SRC=$(ls dist/*.zip | head -1)
          ZIP="dist/ai-knowledge-base-${GITHUB_REF_NAME#kb-v}.zip"
          mv "$SRC" "$ZIP"
          echo "包 = $ZIP （$(du -h "$ZIP" | cut -f1)）"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          ## 整库快照

          下载解压，**双击 `README.html`** 就能读——断网可用，不需要装任何软件。
          讲义 PPTX 用 PowerPoint 或 Keynote 打开。

          包里带：21 册讲义与书单、网页版、库级取用产物（实战包／学习路径／全库一页纸）、
          全套门禁脚本、技能分发包。不带：作者的历史留痕与外部输入档案。

          拿到之后建议先在库根跑一次自检，确认这份拷贝是完整的：

          ```bash
          bash _maintenance/run_all_gates.sh
          ```

          （打包时已经在解压出来的那份里跑过同一条命令——这里再跑一次是验你手上这份。）

          只想要维护这个库的那套方法（技能）、不要这些内容的，见仓库 README 的「两条下载路径」。
          MD
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.zip }}" \
            --title "整库快照 $GITHUB_REF_NAME" \
            --notes-file notes.md
