# 知识库门禁流水线。每道门禁单独一个 step，红的时候一眼看得出是哪一道。
# 全部零第三方依赖——库里所有门禁与生成器都只用 Python 标准库，装依赖这一步本身就不该存在。

name: 门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: 十四道门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- 结构与账本 ----
      - name: 布局就位
        run: python3 _maintenance/check_kb_layout.py

      - name: 门户坏链
        run: python3 _maintenance/check_html_links.py

      - name: 页数账实（单册四账 + 全库总数）
        run: python3 _maintenance/check_page_ledger.py

      - name: 书单账实
        run: python3 _maintenance/check_ebook_ledger.py

      - name: _prep 取用文档同步
        run: python3 _maintenance/check_prep_coverage.py

      # 事实是真的会随挂钟过期的。保鲜看板此前只是报表——可以一直红着而门禁全绿，
      # 没有任何机制强迫人去看它（2026-08-02 补这道）。判据按每条事实自己的
      # 30/90/180 天节奏，不再全库一个阈值。
      - name: 保鲜（事实节奏与不可外推边界）
        run: python3 _maintenance/check_freshness.py

      # 网页版按读者判断链重组时，章节 ID 会与讲义脱钩。既有门禁一道都发现不了：
      # 坏链只查文件在不在、页数账不管章节、_prep 覆盖率拿讲义章节当账本。
      # 这道立两条契约——讲义章节一个都不许丢，旧锚点必须留隐藏别名（2026-08-02 补）。
      - name: 网页章节契约（重组不丢内容、深链不断）
        run: python3 _maintenance/check_web_chapters.py

      # ---- 呈现契约 ----
      - name: 样式契约（孤儿类与缓存版本戳）
        run: python3 _maintenance/check_css_classes.py

      - name: 正文标签配平（真 XML 解析器）
        run: python3 _maintenance/check_html_wellformed.py

      - name: 讲义排版契约（19 册 audit）
        run: python3 _maintenance/audit_pptx.py PPT-version/*/*-讲义.pptx

      # 页脚页码要等于放映位。audit 的 17 项都不看这个数——PE 册曾 62 页错位、
      # 最大差 6 页，历时数个批次无人发现（2026-07-30 补这道）。
      - name: 页脚页码账实
        run: python3 _maintenance/check_footer_pagenum.py

      # ---- 生成物无漂移 ----
      - name: 网页产物与 MANIFEST 一致
        run: python3 Web-version/build.py --check

      # ---- 技能分发 ----
      - name: 技能包结构合格（能装）
        run: python3 _maintenance/check_skill_package.py _skill-source/knowledge-base-builder.skill

      - name: 技能包与源目录一致（不过期）
        run: python3 _maintenance/check_skill_sync.py

      # ---- Portable 铁律 ----
      # 整库要能拷到别的机器上接着用。写死 /Users/<用户名>/… 的脚本换机即废，
      # 而其余门禁一道都查不出——只有这条正则拦得住（口径同 make_share.py 的解压自检）。
      # 实现在脚本里，本地 run_all_gates.sh 跑的是同一份，不再内联（2026-08-02）。
      - name: 无本机绝对路径
        run: python3 _maintenance/check_no_abspath.py

      # ---- 报告型（不拦，只留痕）----
      - name: 数目声明体检（报告，不拦）
        run: python3 _maintenance/check_count_claims.py
