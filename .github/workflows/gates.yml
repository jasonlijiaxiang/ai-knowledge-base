# 知识库门禁流水线。每道门禁单独一个 step，红的时候一眼看得出是哪一道。
# 全部零第三方依赖——库里所有门禁与生成器都只用 Python 标准库，装依赖这一步本身就不该存在。

name: 门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gates-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        # 本机是 3.9、手册承诺 3.7+，CI 跑最低与当前两个版本，别只押一个
        # （2026-09-05 B6）。
        python-version: ["3.9", "3.12"]
    steps:
      # fetch-tags：check_version_tag 在 CI 里因 checkout 不取标签永远空跑过
      # （报告型，但空跑等于没查）。取全标签让它输出真实比对。
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ---- 结构与账本 ----
      - name: 布局就位
        run: python3 _maintenance/check_kb_layout.py

      # data.js 是 check_prep_coverage / check_web_chapters 的账本，先对产物再让它们读账
      # （2026-09-05 B4 提序）。
      - name: 网页产物与 MANIFEST 一致
        run: python3 Web-version/build.py --check

      - name: 门户坏链
        run: python3 _maintenance/check_html_links.py

      - name: 页数账实（单册四账 + 全库总数）
        run: python3 _maintenance/check_page_ledger.py

      - name: 书单账实
        run: python3 _maintenance/check_ebook_ledger.py

      - name: _prep 取用文档同步
        run: python3 _maintenance/check_prep_coverage.py

      # 事实是真的会随挂钟过期的。保鲜看板此前只是报表——可以一直红着而门禁全绿，
      # 没有任何机制强迫人去看它（2026-08-02 补这道）。判据按每条事实自己的
      # 30/90/180 天节奏，不再全库一个阈值。
      # 2026-09-05 起分两层：到期先进「到期待复核」清单，超 KB-CONFIG「超期宽限」才 FAIL
      # （本步不传 --strict）；每周一 freshness.yml 用 --strict 到期即报 issue。
      - name: 保鲜（事实节奏与不可外推边界）
        run: python3 _maintenance/check_freshness.py

      # 网页版按读者判断链重组时，章节 ID 会与讲义脱钩。既有门禁一道都发现不了：
      # 坏链只查文件在不在、页数账不管章节、_prep 覆盖率拿讲义章节当账本。
      # 这道立两条契约——讲义章节一个都不许丢，旧锚点必须留隐藏别名（2026-08-02 补）。
      - name: 网页章节契约（重组不丢内容、深链不断）
        run: python3 _maintenance/check_web_chapters.py

      # ---- 读者面用语 ----
      # 技能架构词汇（一源两面/回刷/真源…）是工作语言，跨到读者面前就是黑话
      # （2026-09-05 补，B5）。
      - name: 内部工作用语
        run: python3 _maintenance/check_internal_terms.py

      # ---- 呈现契约 ----
      - name: 样式契约（孤儿类与缓存版本戳）
        run: python3 _maintenance/check_css_classes.py

      - name: 正文标签配平（真 XML 解析器）
        run: python3 _maintenance/check_html_wellformed.py

      # 不写册数——库会长，写死的数字迟早过期（audit 本来就扫到几册算几册）。
      - name: 讲义排版契约（全库 audit）
        run: python3 _maintenance/audit_pptx.py PPT-version/*/*-讲义.pptx

      # 页脚页码要等于放映位。audit 的 17 项都不看这个数——PE 册曾 62 页错位、
      # 最大差 6 页，历时数个批次无人发现（2026-07-30 补这道）。
      - name: 页脚页码账实
        run: python3 _maintenance/check_footer_pagenum.py

      # ---- 脚本自测 ----
      # 门禁脚本自己的回归防线：标准库 unittest，覆盖保鲜两层语义、数目声明反例、
      # build.py 幂等与 audit 小样张（2026-09-05 补）。
      - name: 脚本自测（unittest）
        run: python3 -m unittest discover -s _maintenance/tests -p 'test_*.py'

      # 信源清单是巡检按信源批处理的起点，由 gen_source_list.py 从 MANIFEST 生成；
      # 之前一直不在门禁里，2026-09-05 实测它已经红了（与 MANIFEST 漂了），没人知道。
      - name: 信源清单与 MANIFEST 一致
        run: python3 _maintenance/gen_source_list.py --check

      # 页面右上角那个号是整库 Release 号，真源是 KB-CONFIG 的「库版本」。
      # 它跟 kb.css?v= 那套缓存戳是两件事——2026-08-03 之前绑在一起，
      # 于是印给读者看的是「样式改到第几轮」，读者根本不关心那个。
      - name: 整库版本戳与 KB-CONFIG 一致
        run: python3 _maintenance/stamp_kb_version.py --check

      # 生成器立的规矩是「产物从源现场生成」，但它自己没有绑定：2026-08-02 生成的两册，
      # 整册内容 JSON 既没进版本库也没留在磁盘上——全库唯一能兑现「改令牌就重渲染」
      # 的地方恰恰兑现不了，而当时 15 道门禁一片绿（2026-08-03 补这道）。
      - name: 生成器册的源 JSON 在位
        run: python3 _maintenance/check_deck_source.py

      # ---- 技能分发 ----
      - name: 技能包结构合格（能装）
        run: python3 _maintenance/check_skill_package.py _skill-source/knowledge-base-builder.skill

      - name: 技能包与源目录一致（不过期）
        run: python3 _maintenance/check_skill_sync.py

      # 上面两道都够不到 `_maintenance/`：库内那份脚本与技能源目录之间没有任何看守。
      # 实测 check_css_classes.py 已经漂了 12 天，且 4 道下游写的门禁从没回流技能
      # ——用技能初始化的新库拿到的是残缺的一套（2026-08-03 补这道）。
      - name: 库内脚本与技能源一致
        run: python3 _maintenance/check_scripts_sync.py

      # ---- Portable 铁律 ----
      # 整库要能拷到别的机器上接着用。写死 /Users/<用户名>/… 的脚本换机即废，
      # 而其余门禁一道都查不出——只有这条正则拦得住（口径同 make_share.py 的解压自检）。
      # 实现在脚本里，本地 run_all_gates.sh 跑的是同一份，不再内联（2026-08-02）。
      - name: 无本机绝对路径
        run: python3 _maintenance/check_no_abspath.py

      # ---- 语义账 ----
      # 模块数、网页覆盖、门禁道数都是能从真源算出来的，却被手写在十几处门面里，
      # 每长一个模块就全线过期。2026-08-03 一次审视扫出 10 处活口径过期而门禁全绿。
      - name: 可派生数目账实（模块数 / 网页覆盖 / 门禁道数）
        run: python3 _maintenance/check_derived_counts.py

      # ---- 报告型（不拦，只留痕）----
      - name: 数目声明体检（报告，不拦）
        run: python3 _maintenance/check_count_claims.py

      # 发不发版是人的决定，机器只负责别让人忘了：SKILL.md 已到 v8.9 而最新标签
      # 停在 skill-v8.1 时，README 承诺的「历次版本去 Releases 找」就不成立了。
      - name: 技能版本 vs 已发布标签（报告，不拦）
        run: python3 _maintenance/check_version_tag.py

      # ---- 对账硬化（2026-09-05）：两份清单必须是同一批脚本，集合比对 ----
      # 数步数防不了「两处各删一道」——这一行上的所有 step 与本地 run_all_gates.sh
      # 的 gate 行抽出脚本名做集合比对，不等即 FAIL。轻量模式：不把 20 道再跑一遍。
      - name: 清单集合比对（本地脚本 ↔ gates.yml）
        run: bash _maintenance/run_all_gates.sh --list-only
